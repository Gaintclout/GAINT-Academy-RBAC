name: GAINT Academy Verification

on:
  push:
    branches:
      - feature/multi-institution-ui
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile backend
        run: python -m compileall -q app
      - name: Validate Alembic migrations
        run: alembic upgrade head
      - name: Import FastAPI application
        run: python -c "from app.main import app; print(app.title)"
      - name: Verify production startup guard
        env:
          APP_ENV: production
          AUTO_CREATE_SCHEMA: "false"
          SEED_DEMO_DATA: "false"
          SECRET_KEY: ci-production-secret-not-for-deployment
        run: python -c "from app.main import app; print(app.title)"

      - name: Run backend tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  frontend:
    name: Frontend production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  mobile:
    name: Mobile verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Check Expo dependency compatibility
        run: npx expo install --check
